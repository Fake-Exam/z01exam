name: Deploy to production

on:
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on manual dispatch
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # L'environnement Production exige l'approbation du mainteneur avant
    # l'exécution ; ses secrets ne sont lisibles qu'après cette approbation.
    environment: Production
    steps:
      - name: Trigger VPS deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_COMMAND: ${{ secrets.VPS_DEPLOY_COMMAND }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "$VPS_DEPLOY_COMMAND" "${{ github.sha }}"
